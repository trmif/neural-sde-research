# Higher School of Economics | Data Science Minor | 2026
# Authors: @trmif | @moriavohus | @rrqwt
#
# CI/CD pipeline: builds Jupyter Book and deploys to GitHub Pages.
# Triggers on push to main or manually via workflow_dispatch.

name: deploy

on:
  push:
    branches:
      - main
      - miftakhutdinov
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter Book
        run: pip install "jupyter-book==1.0.4.post1"

      - name: Build the book
        run: jupyter-book build .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
